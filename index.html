  /** 価格推移のグラフ（SVG） */
  function chartSvg(purchases) {
    const pts = purchases.filter(u => u.unitPrice > 0);
    if (pts.length < 2) return '<p class="small">購入が2回以上になるとグラフを表示します</p>';
    const W = 340, H = 160, L = 46, R = 10, T = 12, B = 26;
    const vals = pts.map(u => u.unitPrice);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (min === max) { min -= 10; max += 10; }
    const pad = (max - min) * 0.15; min -= pad; max += pad;
    const x = i => L + (W - L - R) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
    const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
    const minIdx = vals.indexOf(Math.min(...vals));
    const line = pts.map((u, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(u.unitPrice).toFixed(1)}`).join(' ');
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="購入価格の推移">
      <line x1="${L}" x2="${W - R}" y1="${y(mean)}" y2="${y(mean)}" stroke="#999" stroke-dasharray="4 4"/>
      <text x="${W - R}" y="${y(mean) - 4}" font-size="10" fill="#777" text-anchor="end">平均 ${Math.round(mean)}円</text>
      <text x="${L - 6}" y="${y(max - pad) + 4}" font-size="10" fill="#777" text-anchor="end">${Math.round(max - pad)}</text>
      <text x="${L - 6}" y="${y(min + pad) + 4}" font-size="10" fill="#777" text-anchor="end">${Math.round(min + pad)}</text>
      <path d="${line}" fill="none" stroke="#1f6feb" stroke-width="2.5"/>
      ${pts.map((u, i) => `<circle cx="${x(i)}" cy="${y(u.unitPrice)}" r="${i === minIdx ? 5 : 3.5}" fill="${i === minIdx ? '#138a43' : '#1f6feb'}"/>`).join('')}
      <text x="${L}" y="${H - 6}" font-size="10" fill="#777">${fmtDate(pts[0].date)}</text>
      <text x="${W - R}" y="${H - 6}" font-size="10" fill="#777" text-anchor="end">${fmtDate(pts[pts.length - 1].date)}</text>
    </svg>`;
  }

        <select id="kind">${['通常', 'セール', 'クーポン利用'].map(k => `<option ${k === u.priceKind ? 'selected' : ''}>${k}</option>`).join('')}</select>
        <label class="f" for="point">ポイント還元（任意・判定には含めません）</label>
        <input id="point" inputmode="numeric" value="${esc(u.pointBack || '')}" placeholder="例: 10">
        <p class="small">登録元: ${esc(u.source)}</p>
        <button class="btn" id="save" type="button">保存する</button>
        ${!isNew ? '<button class="btn danger" id="del" type="button">この購入履歴を削除</button>' : ''}
      </div>`;
    $('#save').addEventListener('click', async () => {
      const pid = $('#pid').value;
      const price = Number($('#price').value);
      if (!pid) { toast('商品を選んでください'); return; }
      if (!(price > 0)) { toast('価格を入力してください'); return; }
      const product = await DB.get('products', pid);
      const qty = Math.max(1, Number($('#qty').value) || 1);
      await DB.put('purchases', {
        ...u, id: u.id || DB.newId('u'), productId: pid, unitPrice: price, quantity: qty, totalPrice: price * qty,
        date: $('#date').value || today(), store: $('#store').value.trim(), priceKind: $('#kind').value,
        pointBack: Number($('#point').value) || 0, status: product.status,
        size: u.size || product.size || null, unit: u.unit || product.unit || null,
        createdAt: u.createdAt || new Date().toISOString(),
      });
      toast('保存しました'); go(`#item/${pid}`);
    });
    if (!isNew) $('#del').addEventListener('click', async () => {
      if (!confirm('この購入履歴を削除しますか？')) return;
      await DB.del('purchases', u.id); toast('削除しました'); go(`#item/${u.productId}`);
    });
  }

  // ========== レシート読み取り ==========
  let receiptDraft = null; // 読み取り途中の内容（画面を離れても保持）

  async function viewReceipt() {
    setTitle('レシートを読み取る', false);
    if (receiptDraft) return renderReceiptEdit();
    view.innerHTML = `
      <div class="card">
        <label class="btn">📷 レシートを撮影<input id="cam" type="file" accept="image/*" capture="environment" class="hidden"></label>
        <label class="btn secondary">🖼 写真から選ぶ<input id="pick" type="file" accept="image/*" class="hidden"></label>
        <button class="btn ghost" id="manual" type="button">✍️ 手入力で登録</button>
        <p class="small">文字の読み取りはこのiPhoneの中で行い、画像は外部に送信しません。初回は日本語データ（約15MB）をダウンロードするため時間がかかります。</p>
        <p class="small">きれいに読むコツ: 明るい場所で、レシートをまっすぐ・画面いっぱいに撮影してください。長いレシートは2回に分けて撮影できます。</p>
      </div>
      <div class="card hidden" id="ocrBox">
        <p id="ocrMsg">準備中…</p>
        <div class="progress"><div id="ocrBar"></div></div>
      </div>`;
    const run = async file => {
      if (!file) return;
      $('#ocrBox').classList.remove('hidden');
      try {
        const text = await Receipt.recognize(file, (label, p) => {
          $('#ocrMsg').textContent = `${label}… ${Math.round(p * 100)}%`;
          $('#ocrBar').style.width = `${Math.round(p * 100)}%`;
        });
        const parsed = Receipt.parse(text);
        receiptDraft = { ...parsed, rawText: text, file, saveImage: false };
        if (!parsed.items.length) toast('商品を読み取れませんでした。手入力で追加できます', 3500);
        renderReceiptEdit();
      } catch (e) {
        $('#ocrMsg').innerHTML = `<span style="color:var(--expensive)">読み取りに失敗しました: ${esc(e.message)}</span><br>手入力で登録できます。`;
      }
    };
    $('#cam').addEventListener('change', e => run(e.target.files[0]));
    $('#pick').addEventListener('change', e => run(e.target.files[0]));
    $('#manual').addEventListener('click', () => {
      receiptDraft = { store: '', date: today(), total: null, items: [{ name: '', total: '', quantity: 1, discount: 0, priceKind: '通常' }], rawText: '', manual: true };
      renderReceiptEdit();
    });
  }

  async function renderReceiptEdit() {
    resetView();
    const d = receiptDraft;
    const products = (await DB.all('products')).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ja'));
    // 初回のみ、登録済み商品との照合を行う
    d.items.forEach(it => {
      if (it.choice === undefined) {
        const m = it.name ? Receipt.bestMatch(it.name, products) : null;
        it.choice = m ? `p:${m.product.id}` : 'new';
      }
      if (it.include === undefined) it.include = true;
    });
    const options = it => `
      <option value="new" ${it.choice === 'new' ? 'selected' : ''}>新しい商品として登録（暫定）</option>
      <option value="unknown" ${it.choice === 'unknown' ? 'selected' : ''}>商品を特定できない（未特定で保留）</option>
      ${products.map(p => `<option value="p:${p.id}" ${it.choice === 'p:' + p.id ? 'selected' : ''}>登録済み: ${esc(p.name)}（${esc(Units.sizeLabel(p.size, p.unit))}）</option>`).join('')}`;
    const sum = d.items.filter(i => i.include).reduce((a, i) => a + (Number(i.total) || 0) - (Number(i.discount) || 0), 0);
    view.innerHTML = `
      <div class="notice info">読み取り結果を確認し、違うところは修正してください。レシートでは商品名が省略されることがあるため、分からない商品は「未特定」で保留できます。</div>
      <div class="card">
        <label class="f" for="rStore">店舗名</label><input id="rStore" value="${esc(d.store)}" list="storeList">
        <datalist id="storeList">${(await storeNames()).map(s => `<option value="${esc(s)}">`).join('')}</datalist>
        <div class="row">
          <div><label class="f" for="rDate">購入日</label><input id="rDate" type="date" value="${esc(d.date || today())}"></div>
          <div><label class="f" for="rTotal">合計（レシート）</label><input id="rTotal" inputmode="numeric" value="${esc(d.total ?? '')}"></div>
        </div>
        <p class="small">選択中の商品の合計: <strong id="sumOut">${yen(sum)}</strong>${d.total ? `（レシート合計との差 ${signYen(sum - d.total)}・税や対象外の行で差が出ることがあります）` : ''}</p>
      </div>
      <div id="items">${d.items.map((it, i) => `
        <div class="receipt-item ${it.include ? '' : 'excluded'}" data-i="${i}">
          <label class="check" style="margin:0 0 6px"><input type="checkbox" class="inc" ${it.include ? 'checked' : ''}> 登録する</label>
          <input class="nm" value="${esc(it.name)}" placeholder="商品名（レシートの表記）">
          <div class="row" style="margin-top:6px">
            <div><span class="small">金額</span><input class="tt" inputmode="numeric" value="${esc(it.total)}"></div>
            <div style="flex:0 0 64px"><span class="small">数量</span><input class="qt" inputmode="numeric" value="${esc(it.quantity)}"></div>
            <div><span class="small">値引</span><input class="dc" inputmode="numeric" value="${esc(it.discount || '')}"></div>
          </div>
          <select class="ch" style="margin-top:6px">${options(it)}</select>
        </div>`).join('')}</div>
      <button class="btn ghost" id="addRow" type="button">＋ 行を追加</button>
      <div class="card">
        ${d.file ? `<label class="check"><input type="checkbox" id="saveImg" ${d.saveImage ? 'checked' : ''}> レシート画像も保存する（任意）</label>` : ''}
        <button class="btn" id="register" type="button">購入履歴に登録</button>
        <button class="btn ghost" id="cancel" type="button">やり直す</button>
        ${d.rawText ? `<details><summary>読み取った文字をそのまま見る</summary><pre style="white-space:pre-wrap;font-size:13px">${esc(d.rawText)}</pre></details>` : ''}
      </div>`;

    const sync = () => {
      d.store = $('#rStore').value; d.date = $('#rDate').value; d.total = Number($('#rTotal').value) || null;
      $$('.receipt-item').forEach(el => {
        const it = d.items[Number(el.dataset.i)];
        it.include = el.querySelector('.inc').checked;
        const newName = el.querySelector('.nm').value.trim();
        // 手入力で商品名を入れたとき、登録済みの似た商品を自動で選ぶ
        if (newName !== it.name && el.querySelector('.ch').value === 'new') {
          const m = newName ? Receipt.bestMatch(newName, products) : null;
          if (m) el.querySelector('.ch').value = `p:${m.product.id}`;
        }
        it.name = newName;
        it.total = Number(el.querySelector('.tt').value) || 0;
        it.quantity = Math.max(1, Number(el.querySelector('.qt').value) || 1);
        it.discount = Number(el.querySelector('.dc').value) || 0;
        it.choice = el.querySelector('.ch').value;
        el.classList.toggle('excluded', !it.include);
      });
      const s = d.items.filter(i => i.include).reduce((a, i) => a + i.total - i.discount, 0);
      $('#sumOut').textContent = yen(s);
      if ($('#saveImg')) d.saveImage = $('#saveImg').checked;
    };
    view.addEventListener('input', sync);
    view.addEventListener('change', sync);
    $('#addRow').addEventListener('click', () => { sync(); d.items.push({ name: '', total: '', quantity: 1, discount: 0, priceKind: '通常', choice: 'new', include: true }); renderReceiptEdit(); });
    $('#cancel').addEventListener('click', () => { if (confirm('読み取り結果を破棄しますか？')) { receiptDraft = null; viewReceipt(); } });
    $('#register').addEventListener('click', async () => {
      sync();
      const items = d.items.filter(i => i.include && i.name && i.total > 0);
      if (!items.length) { toast('登録する商品がありません（商品名と金額を入力してください）'); return; }
      const hash = await Receipt.fingerprint({ store: d.store, date: d.date, total: d.total, items });
      const dup = (await DB.byIndex('receipts', 'hash', hash))[0];
      if (dup) {
        if (!confirm(`同じ内容のレシートが ${fmtDateTime(dup.createdAt)} に登録済みです。二重登録になる可能性があります。それでも登録しますか？`)) return;
      }
      const receiptId = DB.newId('r');
      let image = null;
      if (d.saveImage && d.file) image = await resizeImage(d.file, 1200);
      let count = 0;
      for (const it of items) {
        let product;
        if (it.choice.startsWith('p:')) {
          product = await DB.get('products', it.choice.slice(2));
          if (product && it.name !== product.name && !(product.receiptNames || []).includes(it.name)) {
            product.receiptNames = [...(product.receiptNames || []), it.name];
            product = await DB.saveProduct(product);
          }
        }
        if (!product) {
          const parsed = Units.parseSize(it.name);
          product = await DB.saveProduct({
            name: it.name, maker: '', category: '', jan: '',
            size: parsed && !parsed.countOnly && parsed.pack === 1 ? parsed.size : null,
            unit: parsed && !parsed.countOnly && parsed.pack === 1 ? parsed.unit : null,
            receiptNames: [it.name], forceStatus: it.choice === 'unknown' ? '未特定' : null,
          });
        }
        const paid = it.total - it.discount;
        await DB.put('purchases', {
          id: DB.newId('u'), productId: product.id, date: d.date || today(),
          unitPrice: Math.round(paid / it.quantity * 10) / 10, quantity: it.quantity, totalPrice: paid, discount: it.discount,
          priceKind: it.discount > 0 ? (it.priceKind && it.priceKind !== '通常' ? it.priceKind : 'セール') : '通常',
          store: d.store, source: d.manual ? '手入力' : 'レシート', status: product.status, receiptId,
          receiptName: it.name, size: product.size || null, unit: product.unit || null, createdAt: new Date().toISOString(),
        });
        count++;
      }
      await DB.put('receipts', { id: receiptId, hash, store: d.store, date: d.date, total: d.total, itemCount: count, rawText: d.rawText || '', image, createdAt: new Date().toISOString() });
      receiptDraft = null;
      toast(`${count}件を購入履歴に登録しました`, 3000);
      go('#history');
    });
  }

  // ========== 画面の切り替え ==========
  async function route() {
    await Scanner.stop();
    const raw = location.hash.slice(1) || 'home';
    const [path, qs] = raw.split('?');
    const [name, arg] = path.split('/');
    const q = Object.fromEntries(new URLSearchParams(qs || ''));
    document.querySelectorAll('nav.bottom a').forEach(a => {
      const n = a.dataset.nav;
      a.classList.toggle('active', n === name || (n === 'history' && ['item', 'purchase'].includes(name)) || (n === 'scan' && ['judge', 'snap', 'photo'].includes(name)));
    });
    resetView();
    window.scrollTo(0, 0);
    try {
      switch (name) {
        case 'home': await viewHome(); break;
        case 'scan': await viewScan(); break;
        case 'photo': await viewPhoto(); break;
        case 'snap': await viewSnap(); break;
        case 'compare': await viewCompare(); break;
        case 'judge': await viewJudge(arg, q); break;
        case 'receipt': await viewReceipt(); break;
        case 'history': await viewHistory(q); break;
        case 'item': await viewItem(arg); break;
        case 'product': await viewProduct(arg || 'new', q); break;
        case 'purchase': await viewPurchase(arg || 'new', q); break;
        case 'settings': await viewSettings(); break;
        default: await viewHome();
      }
    } catch (e) {
      console.error(e);
      view.innerHTML = `<div class="notice error">エラーが発生しました: ${esc(e.message)}</div><a class="btn" href="#home">ホームへ</a>`;
    }
  }
  window.addEventListener('hashchange', route);
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', route);
  else route();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

</script>
</body>
</html>
